name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests are deliberately network-free. The research tests (shadow, walk-forward, sleeves)
      # need numpy + pandas; without them collection failed on every run since 2026-10-16.
      - name: Install test dependencies
        run: pip install pytest requests numpy pandas

      - name: Run test suite
        run: python -m pytest tests/ -q
